    <aside id="reading" class="glass" aria-labelledby="reading-title" hidden>
      <div class="reading-head">
        <h2 id="reading-title"></h2>
        <button id="close" type="button" aria-label="收起材料">×</button>
      </div>
      <p id="finding"></p>
      <p id="detail" hidden></p>
      <p id="comparison" hidden></p>
      <div id="river-plan" hidden>
        <dl class="river-plan-stats">
          <div><dt>中央红军</dt><dd>8.6 万余人</dd></div>
          <div><dt>主要渡口</dt><dd>8 处</dd></div>
          <div><dt>架设浮桥</dt><dd>5 座</dd></div>
        </dl>
        <ol class="river-plan-timeline">
          <li><strong>1934 年 10 月 17 日起</strong>《野战军南渡贡水计划表》为两个军委纵队和各军团分配渡口、规定时段、调度船只。</li>
          <li><strong>入夜</strong>军民架桥，各部队分批过河。部分渡口靠小船摆渡或涉水。</li>
          <li><strong>拂晓前</strong>拆下浮桥，藏起桥板，清除河滩脚印，避免敌机发现渡河痕迹。</li>
        </ol>
