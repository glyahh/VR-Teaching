    <div id="xiang-tools" class="dock xiang-dock" hidden>
      <span id="xiang-instruction" class="scene-note" aria-live="polite"></span>
      <div class="xiang-force-meter" aria-label="渡江前后兵力变化">
        <span class="xiang-force-track"><span id="xiang-force-fill" class="xiang-force-fill"></span></span>
        <strong id="xiang-force-count" class="xiang-force-count">8.6 万</strong>
      </div>
      <div class="dock-actions xiang-bar glass">
        <button id="xiang-play" type="button" class="river-playback" data-icon="play" aria-label="播放态势推演"><span class="playback-icon" aria-hidden="true"></span></button>
        <input id="xiang-scrubber" class="xiang-scrubber" type="range" min="0" max="100" value="16" aria-label="湘江战役态势进度">
        <div id="xiang-cams" class="xiang-cams" role="group" aria-label="观察机位">
          <button type="button" class="soft-button" data-preset="overview" aria-pressed="true">全景</button>
          <button type="button" class="soft-button" data-preset="wade" aria-pressed="false">涉水</button>
          <button type="button" class="soft-button" data-preset="ridge" aria-pressed="false">阻击</button>
        </div>
      </div>
    </div>
