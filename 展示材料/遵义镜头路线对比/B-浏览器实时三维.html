<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>浏览器实时三维 · 遵义会议桌</title>
  <style>:root {
  color-scheme: dark;
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  color: #f2ead9;
  background: #181b19;
  --edge: #4b4e43;
  --amber: #e4bd85;
}
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 45% 0%, #30362f, #191d1a 54%, #141715) }
button, input { font: inherit }
button { min-height: 34px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--edge); border-radius: 6px; color: #eee7d8; background: #2b302a }
button:hover { border-color: #b4a07e }
button:focus-visible, input:focus-visible, .stage:focus-visible { outline: 2px solid #edc388; outline-offset: 3px }
button:disabled, input:disabled { opacity: .45; cursor: default }
[hidden] { display: none !important }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px clamp(14px,4vw,66px); border-bottom: 1px solid #d5ca9b25 }
.identity, .tools, .rotate, .compare-tools { display: flex; align-items: center; gap: 8px }
.identity { font-size: 13px; letter-spacing: .09em; color: #d1cfbc; font-weight: 600 }
.identity i { width: 13px; height: 16px; border: 1.5px solid #dbba86; box-shadow: inset 3px 0 #ad8a57; transform: skewY(-10deg) }
.identity span { width: 1px; height: 13px; background: #777d6d; margin: 0 4px }
.tools button, .compare-tools button { font-size: 13px }
.shell { width: min(93vw, 1400px, calc(177.778svh - 350px)); min-width: min(92vw,680px); margin: 0 auto 10px }
.heading { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0 }
h1, h2, p { margin: 0 }
h1 { font: 600 clamp(24px,2.4vw,36px)/1.3 "STZhongsong", "SimSun", serif; letter-spacing: .08em }
.heading strong { color: var(--amber); font-size: 14px; font-weight: 500 }
.stage, .comparison-stage { position: relative; isolation: isolate; aspect-ratio: 16/9; background: #1c211c; overflow: hidden }
.stage { border-radius: 9px 9px 0 0; cursor: grab; touch-action: none; box-shadow: 0 14px 40px #0004; user-select: none }
.stage:active { cursor: grabbing }
.stage canvas, .stage video, .comparison-stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain }
.stage video { opacity: 0; pointer-events: none }
.stage.video-on video { opacity: 1 }
.pin { position: absolute; min-height: 0; padding: 0; width: 27px; height: 27px; transform: translate(-50%,-50%); border-radius: 50%; background: #18201b8c; border: 1px solid #f6d398; box-shadow: 0 1px 9px #0009; display: grid; place-items: center }
.pin i { width: 7px; height: 7px; border-radius: 50%; background: #ffe0a5 }
.pin span { position: absolute; left: 30px; top: -1px; padding: 3px 7px; white-space: nowrap; background: #17201ae6; border-radius: 4px; color: #ffe5b7; font-size: 12px; pointer-events: none }
.source-label { position: absolute; left: 12px; bottom: 10px; color: #f4eedb; font-size: 11px; text-shadow: 0 1px 4px black; pointer-events: none }
#notice { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #18201bf2; border: 1px solid var(--edge); border-radius: 6px; padding: 8px 16px; text-align: center }
.transport { display: flex; align-items: center; gap: 14px; padding: 10px 13px; border: 1px solid var(--edge); border-top: 0; border-radius: 0 0 9px 9px; background: #222820 }
.rotate { gap: 1px }
.rotate button { border: 0; min-width: 28px }
.rotate button:first-child, .rotate button:last-child { font-size: 20px; line-height: 1; padding-inline: 10px }
.timeline { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0 }
input[type=range] { accent-color: var(--amber); cursor: pointer }
.timeline input { width: 100%; min-width: 30px }
.timeline output { font-size: 12px; color: #d1cebd; white-space: nowrap; font-variant-numeric: tabular-nums }
.primary, button[aria-pressed=true] { color: #302717; background: #e6c798; border-color: #e6c798; font-weight: 600 }
.hint, dialog p { padding-top: 8px; color: #c4c7b6; font-size: 13px; line-height: 1.55 }
dialog { width: min(860px, 94vw); max-height: 96vh; overflow: auto; border: 1px solid #6b6e59; border-radius: 10px; padding: 16px; background: #222820; color: #f1e9d7 }
dialog::backdrop { background: #0d120fd9 }
dialog form { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px }
dialog h2 { font-size: 19px }
.compare-tools { margin-bottom: 8px }
.comparison-stage { --split: 50%; border-radius: 4px }
.comparison-stage #before { clip-path: inset(0 calc(100% - var(--split)) 0 0) }
.comparison-stage i { position: absolute; left: var(--split); top: 0; bottom: 0; width: 2px; background: #f3c47f; pointer-events: none }
#divider { display: block; width: 100%; margin: 10px 0 0 }
body.projecting { display: grid; min-height: 100vh; place-items: center; background: black; overflow: hidden }
.projecting .teacher, .projecting .pin { display: none !important }
.projecting .shell { width: min(100vw,177.77778vh); min-width: 0; margin: 0 }
.projecting .stage { border-radius: 0; box-shadow: none; cursor: default }
@media(max-width:640px) {
  .shell { width: 96vw; min-width: 0 }
  .toolbar { padding: 8px }
  .heading { padding: 10px 0 }
  .heading strong { font-size: 12px }
  .transport { flex-wrap: wrap; gap: 6px; padding: 8px }
  .timeline { flex-basis: 100%; order: 2 }
  .primary { margin-left: auto }
}
</style>
</head>
<body>
  <header class="toolbar teacher">
    <div class="identity"><i aria-hidden="true"></i>长征课堂<span></span>镜头实验</div>
    <div class="tools">
      <button id="check" disabled>对位检查</button>
      <button id="project" disabled>打开投影</button>
    </div>
  </header>
  <main class="shell">
    <div class="heading teacher"><h1>遵义会议桌</h1><strong id="method">浏览器实时三维</strong></div>
    <section class="stage" id="stage" aria-label="会议桌互动场景" tabindex="0">
      <canvas id="space" hidden aria-label="实时三维会场"></canvas>
      <canvas id="plate" hidden aria-label="多机位渲染图"></canvas>
      <video id="film" playsinline muted preload="auto" aria-label="会场翻页短片"></video>
      <button class="pin" id="pin" hidden aria-label="翻阅桌上卷宗"><i></i><span>卷宗</span></button>
      <span class="source-label">教学情境复原</span>
      <div id="notice" role="status">正在读取会场…</div>
    </section>
    <section class="transport teacher" aria-label="课堂控制">
      <div class="rotate">
        <button id="left" title="向左观察" aria-label="向左观察">‹</button>
        <button id="front" title="回到正面机位">正面</button>
        <button id="right" title="向右观察" aria-label="向右观察">›</button>
      </div>
      <div class="timeline"><input id="seek" type="range" min="0" max="4" step="0.02" value="0" aria-label="翻页进度" disabled><output id="time">0.0 / 4.0 秒</output></div>
      <button id="reset" hidden>返回观察</button>
      <button id="play" class="primary" disabled>翻阅卷宗</button>
    </section>
    <p class="hint teacher" id="hint"></p>
  </main>
  <dialog id="comparison">
    <form method="dialog"><h2 id="compare-title">入片对位</h2><button aria-label="关闭对位检查">关闭</button></form>
    <div class="compare-tools">
      <button id="seam" aria-pressed="true">交接两帧</button>
      <button id="original" aria-pressed="false">原课件参照</button>
    </div>
    <div class="comparison-stage" id="wipe"><img id="after" alt=""><img id="before" alt=""><i></i></div>
    <input type="range" min="0" max="100" value="50" id="divider" aria-label="两帧对照分界">
    <p id="pair-label"></p>
  </dialog>

  <script>(() => {
  'use strict';

  const radians = Math.PI / 180;
  const floatsPerVertex = 9;
  const pageSegments = 36;
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
  const dot = (firstVector, secondVector) => firstVector[0] * secondVector[0] + firstVector[1] * secondVector[1] + firstVector[2] * secondVector[2];
  const cross = (firstVector, secondVector) => [firstVector[1] * secondVector[2] - firstVector[2] * secondVector[1], firstVector[2] * secondVector[0] - firstVector[0] * secondVector[2], firstVector[0] * secondVector[1] - firstVector[1] * secondVector[0]];
  function unit(vector) {
    const length = Math.hypot(...vector) || 1;
    return vector.map(component => component / length);
  }

  function perspective(eye, back, right, tanHalfFov, aspect, near, far) {
    const up = cross(back, right);
    const sx = 1 / (aspect * tanHalfFov);
    const sy = 1 / tanHalfFov;
    const projectionDepth = (near + far) / (near - far);
    const matrix = new Float32Array(16);
    for (let localIndex = 0; localIndex < 3; localIndex++) {
      matrix.set([sx * right[localIndex], sy * up[localIndex], projectionDepth * back[localIndex], -back[localIndex]], localIndex * 4);
    }
    matrix.set([-sx * dot(right, eye), -sy * dot(up, eye),
      -projectionDepth * dot(back, eye) + 2 * near * far / (near - far), dot(back, eye)], 12);
    return { eye, back, right, up, matrix };
  }

  function orbit(camera, pose, aspect, far) {
    const yaw = (pose?.yaw ?? camera.yaw) * radians;
    const pitch = (pose?.pitch ?? camera.pitch) * radians;
    const radius = pose?.radius ?? camera.radius;
    const back = [Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)];
    const eye = camera.target.map((component, localIndex) => component + radius * back[localIndex]);
    const tan = Math.tan(camera.fov * radians / 2);
    return perspective(eye, back, [Math.cos(yaw), 0, -Math.sin(yaw)], tan, aspect, Math.min(.10, radius * .15), far);
  }

  function joinRings(out, firstRing, nextRing) {
    for (let localIndex = 1; localIndex < firstRing.length; localIndex++) out.push(firstRing[localIndex - 1], nextRing[localIndex - 1], nextRing[localIndex], firstRing[localIndex - 1], nextRing[localIndex], firstRing[localIndex]);
  }

  function boxMesh(size, texture) {
    const out = [], radius = Math.min(.008, .09 * Math.min(...size));
    function face(normal, across, down) {
      const width = Math.abs(dot(size, across)), height = Math.abs(dot(size, down));
      const stops = span => radius < .0009 ? [0, 1] : [0, radius / span, 1 - radius / span, 1];
      const columns = stops(width);
      let previous;
      for (const axisV of stops(height)) {
        const row = columns.map(axisU => {
          let position = normal.map((component, localIndex) => size[localIndex] * (component / 2 + (axisU - .5) * across[localIndex] + (axisV - .5) * down[localIndex]));
          let unitNormal = normal;
          if (radius >= .0009) {
            const inner = position.map((component, localIndex) => clamp(component, radius - size[localIndex] / 2, size[localIndex] / 2 - radius));
            unitNormal = unit(position.map((component, localIndex) => component - inner[localIndex]));
            position = inner.map((component, localIndex) => component + unitNormal[localIndex] * radius);
          }
          let tu = axisU, tv = axisV;
          if (normal[1] !== 1 && texture === 'cover.jpg') {
            tu = .03; tv = .04;
          } else if (normal[1] === 0 && texture === 'wood.jpg') {
            tu = height > width ? (1 - axisV) * height / 2.56 : axisU * width / 2.56;
            tv = .09 + (height > width ? axisU * width : axisV * height) / 1.34;
          }
          return [...position, ...unitNormal, tu, tv];
        });
        if (previous) joinRings(out, previous, row);
        previous = row;
      }

    face([0, 1, 0], [1, 0, 0], [0, 0, 1]);
    face([0, -1, 0], [1, 0, 0], [0, 0, -1]);
    face([0, 0, 1], [1, 0, 0], [0, -1, 0]);
    face([0, 0, -1], [-1, 0, 0], [0, -1, 0]);
    face([1, 0, 0], [0, 0, -1], [0, -1, 0]);
    face([-1, 0, 0], [0, 0, 1], [0, -1, 0]);
    return out;
  }

  function roundMesh(kind, size) {
    const [rx, ry, rz] = size.map(coordX => coordX / 2), slices = 40;
    const bevel = Math.min(.008, .09 * Math.min(...size));
    const out = [], rings = [];
    const spherical = kind === 'sphere';
    const rimAngles = [90, 45, 0, 0, -45, -90];
    const bandCount = spherical ? 16 : rimAngles.length - 1;

      const coordY = spherical ? ry * vertical : (row < 3 ? 1 : -1) * (ry - bevel) + bevel * vertical;

        const coordX = spherical ? rx * radial * sin : (rx - inset) * sin;
        const coordZ = spherical ? rz * radial * cos : (rz - inset) * cos;
        const side = unit([sin / rx, 0, cos / rz]);
        const unitNormal = spherical ? unit([radial * sin / rx, vertical / ry, radial * cos / rz]) : [radial * side[0], vertical, radial * side[2]];

      if (row) joinRings(out, rings[row - 1], ring);
      rings.push(ring);

        }
      }
    }
    return out;
  }

  function staticMesh(scene) {
    const vertices = [], batches = [], groups = new Map();
    for (const node of scene.nodes) {
      if (!groups.has(node.material)) groups.set(node.material, []);
      groups.get(node.material).push(node);
    }
    const { hinge, width, depth } = scene.object;
    for (const [key, nodes] of groups) {
      const start = vertices.length / floatsPerVertex;
      const texture = scene.materials[key].texture;
      for (const node of nodes) {

          const view = orbit(camera, camera, ratio, far);
          const scale = Math.min(1, Math.min(1280, maxTarget) / Math.max(image.naturalWidth, image.naturalHeight));
          const map = target(Math.max(1, Math.round(image.naturalWidth * scale)), Math.max(1, Math.round(image.naturalHeight * scale)));
          depthPass(map, view.matrix);
          calibration = { view, depth: map.texture };
          anchorDepths.set(ratio, calibration);
        }
        return { ...calibration, texture: imageTexture(image, false) };
      }
      const first = frame(firstImage), last = frame(tailImage);
      screenTarget();
      const flame = scene.nodes.find(node => node.kind === 'sphere' && scene.materials[node.material].emission > 1);
      const lamp = flame ? [...flame.pos, scene.materials[flame.material].emission] : [0, 0, 0, 0];
      function surfaceMaterial(key, spec) {
        return { color: rgb(spec.color), texture: maps.get(spec.texture) || white,
          props: [spec.roughness ?? .73, spec.emission ?? 0, key === 'brass' ? .78 : 0, spec.texture === 'wood.jpg' ? 1 : 0] };
      }
      const batches = compiled.batches.map(batch => ({ ...batch, material: surfaceMaterial(batch.key, scene.materials[batch.key]) }));
      const leaf = surfaceMaterial('leaf', leafSpec);
      function setMaterial(material, isPage) {
        gl.uniform3fv(surface.u.uColor, material.color);
        gl.uniform4fv(surface.u.uMaterial, material.props);
        gl.uniform1f(surface.u.uPage, Number(isPage));
        useTexture(0, material.texture);
      }
      for (const pass of [surface, sky]) {
        gl.useProgram(pass.program);
        gl.uniform1i(pass.u.uFrame, 3); gl.uniform1i(pass.u.uFrameDepth, 4);
        gl.uniform1f(pass.u.uFar, far);
      }
      gl.useProgram(surface.program);
      gl.uniform1i(surface.u.uSurface, 0); gl.uniform1i(surface.u.uShadow, 1); gl.uniform1i(surface.u.uContact, 2);
      gl.uniformMatrix4fv(surface.u.uLightVP, false, light.matrix);
      gl.uniform3fv(surface.u.uKey, lighting.key); gl.uniform3fv(surface.u.uFill, lighting.fill);
      gl.uniform4fv(surface.u.uLamp, lamp); gl.uniform4fv(surface.u.uDeskRect, desk.rect);
      gl.uniform1f(surface.u.uDeskY, desk.y); gl.uniform1f(surface.u.uShadowTexel, 1 / shadowSize);
      gl.uniform1f(surface.u.uLightSpan, 2 * lightTan);

      function draw(pose, progress = 0, match = 0, useTail = false) {
        if (disposed) throw new Error('渲染器已释放');
        const angle = pageAngle(progress), view = viewAt(pose);
        setPage(angle);
        if (shadowAngle !== angle) {
          depthPass(shadow, light.matrix);
          shadowAngle = angle;
        }
        const image = useTail ? last || first : first;
        const delta = Math.acos(clamp(dot(view.back, anchorCamera.back), -1, 1));
        const zoom = Math.abs(Math.log((pose?.radius ?? camera.radius) / camera.radius));
        const depthTarget = Math.min(1, Math.hypot(delta / (14 * radians), zoom / .16));
        const weight = image ? clamp(match, 0, 1) * (1 - depthTarget * depthTarget * (3 - 2 * depthTarget)) : 0;
        const check = clamp(depthTarget * 14 + angle * 4, 0, 1);
        const matrix = image?.view.matrix || anchorCamera.matrix;
        useTexture(1, shadow.texture); useTexture(2, contact);
        useTexture(3, image?.texture || white); useTexture(4, image?.depth || white);
        screenTarget();
        gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        function useProjected(pass) {
          gl.useProgram(pass.program);
          gl.uniformMatrix4fv(pass.u.uAnchorVP, false, matrix);
          gl.uniform1f(pass.u.uMatch, weight); gl.uniform1f(pass.u.uCheckVisibility, check);
        }
        gl.disable(gl.DEPTH_TEST);
        useProjected(sky);
        const tan = Math.tan(camera.fov * radians / 2);
        gl.uniform3fv(sky.u.uRight, view.right.map(component => component * tan * aspect()));
        gl.uniform3fv(sky.u.uUp, view.up.map(component => component * tan));
        gl.uniform3fv(sky.u.uBack, view.back);
        gl.bindBuffer(gl.ARRAY_BUFFER, skyTriangle);
        for (let localIndex = 1; localIndex < 4; localIndex++) gl.disableVertexAttribArray(localIndex);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.enable(gl.DEPTH_TEST);
        useProjected(surface);
        gl.uniformMatrix4fv(surface.u.uVP, false, view.matrix);
        gl.uniform3fv(surface.u.uEye, view.eye);
        bindMesh(solids);
        for (const batch of batches) {
          setMaterial(batch.material, false);
          gl.drawArrays(gl.TRIANGLES, batch.start, batch.count);
        }
        setMaterial(leaf, true); bindMesh(page); gl.drawArrays(gl.TRIANGLES, 0, pageCount);
      }

      function project(world, pose) {
        const view = viewAt(pose), offset = world.map((component, localIndex) => component - view.eye[localIndex]);
        const distance = -dot(view.back, offset);
        if (distance <= 0) return [NaN, NaN];
        const halfHeight = distance * Math.tan(camera.fov * radians / 2);
        return [.5 + dot(view.right, offset) / (2 * halfHeight * aspect()), .5 - dot(view.up, offset) / (2 * halfHeight)];
      }
      function pick(nx, ny, pose, progress = 0) {
        if (disposed || !(nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1)) return false;
        setPage(pageAngle(progress));
        depthPass(pickTarget, viewAt(pose).matrix, nx, ny);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pickedPixel);
        screenTarget();
        return pickedPixel[0] > 127;
      }
      return { draw, project, pick, dispose };
    } catch (error) {
      dispose();
      throw error;
    }
  }

  globalThis.createDeskRenderer = createDeskRenderer;
})();
</script>
  <script>const get = id => document.getElementById(id);
const stage = get('stage');
const plate = get('plate');
const space = get('space');
const film = get('film');
const route = LAB.route;
const liveScene = route !== 'A';
const usesFilm = route !== 'B';
const baseCamera = LAB.scene.camera;
const anchor = {yaw: baseCamera.yaw, pitch: baseCamera.pitch, radius: baseCamera.radius};
const pageModel = LAB.scene.object;
const publicKey = new URLSearchParams(location.hash.slice(1)).get('p');
const projecting = Boolean(publicKey && /^[0-9a-f]{32}$/.test(publicKey));
document.body.classList.toggle('projecting', projecting);

const state = {
  pose: {...anchor, yaw: -16},
  phase: 'browse',
  paused: false,
  finished: false,
  time: 0,
  duration: 4,
};
let renderer;
let strips = [];
let loaded = false;
let dirty = true;
let epoch = 0;
let transition = null;
let previousTick = 0;
let animationFrame = 0;
let popup = null;
let sessionKey = '';
let recipientReady = false;
let sequence = 0;
let lastReceived = 0;
let lastPublish = 0;
let remoteClock = null;
let pointer = null;
let comparisonEpoch = 0;
let seamPair = null;
let actualCut = null;
let publicMediaEpoch = 0;
let filmSurfaceReady = false;

const limit = (value, low, high) => Math.max(low, Math.min(high, value));
const ease = value => value * value * (3 - 2 * value);
const radians = degrees => degrees * Math.PI / 180;
const lerp = (start, end, fraction) => start + (end - start) * fraction;
const hints = {
  A: '左右拖动切换预渲染机位，点桌上的卷宗翻阅。',
  B: '拖动绕桌，滚轮拉近。翻页时也可以换角度。',
  C: '拖动绕桌，滚轮拉近。点卷宗后镜头归位，再进入短片。',
};

function imageReady(src) {
  return new Promise((resolve, reject) => {
    const picture = new Image();
    picture.onload = () => resolve(picture);
    picture.onerror = () => reject(new Error('内嵌画面读取失败'));
    picture.src = src;
  });
}

function waitMedia(element, eventName, satisfied) {
  if (satisfied()) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const clear = () => {
      clearTimeout(timer);
      element.removeEventListener(eventName, success);
      element.removeEventListener('error', failure);
    };
    const success = () => {
      if (!satisfied()) return;
      clear();
      resolve();
    };
    const failure = () => {
      clear();
      reject(new Error('本机未能解码内嵌短片'));
    };
    const timer = setTimeout(failure, 8000);
    element.addEventListener(eventName, success);
    element.addEventListener('error', failure);
  });
}

async function positionFilm(element, seconds, valid = () => true) {
  await waitMedia(element, 'loadeddata', () => element.readyState >= 2);
  if (!valid()) return;
  if (Math.abs(element.currentTime - seconds) > .007) element.currentTime = seconds;
  await waitMedia(element, 'seeked', () => !element.seeking && element.readyState >= 2);
}

function viewIndex(yaw) {
  return limit(Math.round((yaw + 32) / 4), 0, 16);
}

function projectStill(point, pose) {
  const angle = radians(pose.yaw);
  const tilt = radians(pose.pitch);
  const offset = point.map((value, index) => value - baseCamera.target[index]);
  const depth = pose.radius - offset[0] * Math.sin(angle) * Math.cos(tilt)
    - offset[1] * Math.sin(tilt) - offset[2] * Math.cos(angle) * Math.cos(tilt);
  const across = offset[0] * Math.cos(angle) - offset[2] * Math.sin(angle);
  const above = -offset[0] * Math.sin(angle) * Math.sin(tilt) + offset[1] * Math.cos(tilt)
    - offset[2] * Math.cos(angle) * Math.sin(tilt);
  const height = 2 * depth * Math.tan(radians(baseCamera.fov) / 2);
  return [.5 + across / (height * 16 / 9), .5 - above / height];
}

function targetPoint(across, deep) {
  const [left, height, center] = pageModel.hinge;
  return [left + pageModel.width * across, height, center + pageModel.depth * deep];
}

function visiblePose() {
  if (liveScene) return state.pose;
  return {...anchor, yaw: viewIndex(state.pose.yaw) * 4 - 32};
}

function hitPaper(horizontal, vertical) {
  const pose = visiblePose();
  if (liveScene) return renderer.pick(horizontal, vertical, pose, state.phase === 'clip' ? state.time/state.duration : 0);
  const corners = [[0,-.5],[1,-.5],[1,.5],[0,.5]].map(([across, deep]) => projectStill(targetPoint(across, deep),pose));
  const products = corners.map(([startX,startY],index) => {
    const [endX,endY] = corners[(index + 1) % corners.length];
    return (endX - startX) * (vertical - startY) - (endY - startY) * (horizontal - startX);
  });
  return products.every(value => value >= 0) || products.every(value => value <= 0);
}

function matchAmount(pose) {
  if (route !== 'C') return 0;
  const distance = Math.hypot((pose.yaw-anchor.yaw)/16, (pose.pitch-anchor.pitch)/12, (pose.radius-anchor.radius)/.62);
  return ease(limit(1-distance,0,1));
}

function drawScene() {
  if (!loaded) return;
  const pose = visiblePose();
  const isMovie = usesFilm && state.phase === 'clip' && filmSurfaceReady;
  stage.classList.toggle('video-on', isMovie);
  if (liveScene && !isMovie) {
    const progress = !usesFilm && state.phase === 'clip' ? state.time/state.duration : 0;
    renderer.draw(pose, progress, matchAmount(pose), state.finished);
  } else if (!liveScene && !isMovie) {
    plate.getContext('2d').drawImage(strips[viewIndex(pose.yaw)],0,0,plate.width,plate.height);
  }
  const pin = get('pin');
  pin.hidden = projecting || state.phase !== 'browse';
  if (!pin.hidden) {
    const point = targetPoint(.5,0);
    const [horizontal, vertical] = liveScene ? renderer.project(point,pose) : projectStill(point,pose);
    pin.style.left = (horizontal * 100)+'%';
    pin.style.top = (vertical * 100)+'%';
  }
  dirty = false;
}

function showControls() {
  const browse = state.phase === 'browse';
  const canLook = browse || (route === 'B' && state.phase === 'clip');
  stage.dataset.phase = state.phase;
  stage.dataset.paused = String(state.paused);
  stage.dataset.finished = String(state.finished);
  const pose = visiblePose();
  for (const field of ['yaw','pitch','radius']) stage.dataset[field] = pose[field].toFixed(4);
  get('play').textContent = browse ? (state.finished ? '再翻一次' : '翻阅卷宗') : state.paused ? '继续' : '暂停';
  get('reset').hidden = browse;
  for (const id of ['front','left','right']) get(id).disabled = !loaded || !canLook;
  get('seek').disabled = state.phase !== 'clip';
  get('seek').max = state.duration;
  get('seek').value = state.time;
  get('time').textContent = state.time.toFixed(1)+' / '+state.duration.toFixed(1)+' 秒';
  get('hint').textContent = state.phase === 'align'
    ? (state.paused ? '镜头已暂停。' : '正在回到入片机位。')
    : state.phase === 'clip' ? (route === 'B' ? '动作由浏览器绘制，仍可旋转观察。' : '正在观看固定机位短片。')
    : hints[route];
}

function refresh(publish = false) {
  dirty = true;
  drawScene();
  showControls();
  if (publish) publishView(true);
}

function resizeScene() {
  if (liveScene) {
    const width = Math.max(320, Math.min(1280, Math.round(stage.clientWidth * Math.min(devicePixelRatio,1.5) / 16) * 16));
    if (space.width !== width) {
      space.width = width;
      space.height = width * 9/16;
    }
  }
  if (loaded) refresh();
}

function setPose(next) {
  if (projecting || !loaded || (state.phase !== 'browse' && !(route === 'B' && state.phase === 'clip'))) return;
  state.pose = {
    yaw: limit(next.yaw,-32,32),
    pitch: liveScene ? limit(next.pitch,12,37) : anchor.pitch,
    radius: liveScene ? limit(next.radius,1.83,3.45) : anchor.radius,
  };
  if (!liveScene) state.pose.yaw = viewIndex(state.pose.yaw)*4-32;
  refresh(true);
}

function backToDesk(completed = false) {
  epoch++;
  transition = null;
  filmSurfaceReady = false;
  if (usesFilm) film.pause();
  state.phase = 'browse';
  state.paused = false;
  state.finished = completed;
  state.time = completed ? state.duration : 0;
  refresh(true);
}

function problem(message) {
  get('notice').hidden = false;
  get('notice').textContent = message;
}

function playVideo(run) {
  return film.play().catch(() => {
    if (run !== epoch || state.phase !== 'clip' || state.paused) return;
    state.paused = true;
    refresh(true);
    problem('播放被浏览器暂停，可点击继续。');
  });
}

function startAction() {
  if (!loaded || projecting || state.phase !== 'browse') return;
  const run = ++epoch;
  state.time = 0;
  state.finished = false;
  state.paused = false;
  get('notice').hidden = true;
  if (usesFilm) {
    filmSurfaceReady = false;
    state.phase = 'align';
    transition = {
      from: {...state.pose}, elapsed: 0, ready: false, heldAtAnchor: 0,
      duration: .32 + Math.min(.61, Math.hypot(state.pose.yaw, state.pose.pitch-anchor.pitch)*.015 + Math.abs(state.pose.radius-anchor.radius)*.21),
    };
    film.pause();
    positionFilm(film,0,()=>run===epoch).then(()=>{
      if (run === epoch && transition) transition.ready = true;
    }).catch(()=>{
      if (run === epoch) {backToDesk();problem('短片未就绪，可以继续观察或重试。');}
    });
  } else {
    state.phase = 'clip';
  }
  refresh(true);
}

function togglePlay() {
  if (state.phase === 'browse') {startAction();return;}
  if (projecting || !loaded) return;
  get('notice').hidden = true;
  state.paused = !state.paused;
  if (usesFilm && state.phase === 'clip') {
    if (state.paused) {film.pause();state.time = film.currentTime;}
    else playVideo(epoch);
  }
  refresh(true);
}

function tick(now) {
  const delta = previousTick ? Math.min((now-previousTick)/1000,.20) : 0;
  previousTick = now;
  if (!projecting && state.phase === 'align' && transition && !state.paused) {
    const move = transition;
    move.elapsed += delta;
    const fraction = Math.min(1,move.elapsed/move.duration);
    for (const key of ['yaw','pitch','radius']) state.pose[key] = lerp(move.from[key],anchor[key],ease(fraction));
    if (fraction === 1) {
      move.heldAtAnchor += delta;
      if (move.ready && move.heldAtAnchor >= .09) {
        drawScene();
        actualCut = {from: move.from.yaw, before:copyFrame(liveScene ? space : plate), after:copyFrame(film)};
        transition = null;
        filmSurfaceReady = true;
        state.phase = 'clip';
        const run = epoch;
        requestAnimationFrame(() => {
          if (run===epoch && state.phase==='clip' && !state.paused) playVideo(run);
        });
      }
    }
    dirty = true;
  } else if (state.phase === 'clip' && !state.paused) {
    if (usesFilm) state.time = film.currentTime;
    else if (projecting && remoteClock) state.time = Math.min(state.duration,remoteClock.time + (performance.now()-remoteClock.stamp)/1000);
    else state.time = Math.min(state.duration,state.time+delta);

  }

  if (!projecting && state.phase !== 'browse' && !state.paused) publishView(false);
  animationFrame = requestAnimationFrame(tick);
}

film.addEventListener('ended',() => {
  if (!projecting && state.phase === 'clip') backToDesk(true);
});
get('play').onclick = togglePlay;
get('pin').onclick = startAction;
get('reset').onclick = () => backToDesk();
get('left').onclick = () => setPose({...state.pose,yaw:state.pose.yaw-8});
get('right').onclick = () => setPose({...state.pose,yaw:state.pose.yaw+8});
get('front').onclick = () => setPose({...anchor});
get('seek').oninput = event => {
  if (projecting || state.phase !== 'clip') return;
  state.time = Number(event.target.value);
  if (usesFilm) film.currentTime = state.time;
  refresh(true);
};
film.addEventListener('seeked',() => {
  if (state.phase === 'clip' && !projecting) {state.time = film.currentTime;refresh(true);}
});

stage.addEventListener('pointerdown',event=>{
  if (projecting || !loaded || !event.isPrimary || event.button !== 0 || event.target.closest('button')) return;
  pointer = {id:event.pointerId,x:event.clientX,y:event.clientY,pose:{...state.pose},drag:false};
  stage.setPointerCapture(event.pointerId);
});
stage.addEventListener('pointermove',event=>{
  if (!pointer || event.pointerId !== pointer.id) return;
  const dx = event.clientX - pointer.x, dy = event.clientY - pointer.y;
  if (Math.hypot(dx,dy) > 4) pointer.drag = true;
  if (pointer.drag) setPose({...pointer.pose,yaw:pointer.pose.yaw-dx*80/stage.clientWidth,pitch:pointer.pose.pitch+dy*42/stage.clientHeight});
});
stage.addEventListener('pointerup',event=>{
  if (!pointer || event.pointerId !== pointer.id) return;
  const tap = !pointer.drag;
  pointer = null;
  if (tap && state.phase === 'browse') {
    const rect = stage.getBoundingClientRect();
    if (hitPaper((event.clientX-rect.x)/rect.width,(event.clientY-rect.y)/rect.height)) startAction();
  }
});
stage.addEventListener('pointercancel',()=>{pointer=null;});
stage.addEventListener('wheel',event=>{
  if (!liveScene || projecting) return;
  event.preventDefault();
  setPose({...state.pose,radius:state.pose.radius*Math.exp(limit(event.deltaY,-180,180)*.0015)});
},{passive:false});
stage.addEventListener('keydown',event=>{
  if (projecting || event.target !== stage) return;
  const pose = state.pose;
  if (event.key === 'ArrowLeft') setPose({...pose,yaw:pose.yaw-4});
  else if (event.key === 'ArrowRight') setPose({...pose,yaw:pose.yaw+4});
  else if (event.key === 'ArrowUp') setPose({...pose,pitch:pose.pitch+3});
  else if (event.key === 'ArrowDown') setPose({...pose,pitch:pose.pitch-3});
  else if (event.key === 'Home') setPose({...anchor});
  else if (event.key === ' ' || event.key === 'Enter') togglePlay();
  else return;
  event.preventDefault();
});

function publishView(force) {
  if (!recipientReady || !popup || popup.closed) return;
  if (!force && performance.now()-lastPublish<110) return;
  lastPublish=performance.now();
  popup.postMessage({type:'scene',token:sessionKey,seq:++sequence,stamp:Date.now(),view:{...state,pose:{...state.pose}}},'*');
}

function applyPublic(message) {
  if (!loaded || message.seq <= lastReceived) return;
  lastReceived = message.seq;
  const next = message.view;
  const previousPhase = state.phase;
  state.pose = {...next.pose};
  state.phase = next.phase;
  state.paused = next.paused;
  state.finished = next.finished;
  const delay = next.phase === 'clip' && !next.paused ? limit((Date.now()-message.stamp)/1000,0,.4) : 0;
  state.time = Math.min(state.duration,next.time+delay);
  remoteClock = {time:state.time,stamp:performance.now()};
  if (usesFilm) {
    if (state.phase !== 'clip') {
      if (previousPhase==='clip') publicMediaEpoch++;
      filmSurfaceReady=false;
      film.pause();
      if (state.phase==='align' && previousPhase!=='align' && film.currentTime>.007) film.currentTime=0;
    } else if (previousPhase!=='clip') {
      const generation=++publicMediaEpoch;
      filmSurfaceReady=false;
      film.pause();
      positionFilm(film,state.time,()=>generation===publicMediaEpoch).then(()=>{
        if(generation!==publicMediaEpoch||state.phase!=='clip') return;
        filmSurfaceReady=true;
        if(!state.paused)film.play().catch(()=>{});
        refresh();
      }).catch(()=>{if(generation===publicMediaEpoch)problem('投影视频未就绪，已保留场景画面。');});
    } else if(filmSurfaceReady) {
      const tolerance = state.paused ? .045 : .20;
      if (!film.seeking && Math.abs(film.currentTime-state.time)>tolerance) film.currentTime = state.time;
      if (state.paused) film.pause();
      else if (film.paused) film.play().catch(()=>{});
    }
  }
  refresh();
}
get('project').onclick=()=>{
  if (popup && !popup.closed) {popup.focus();publishView(true);return;}
  sessionKey=[...crypto.getRandomValues(new Uint8Array(16))].map(byte=>byte.toString(16).padStart(2,'0')).join('');
  const url=new URL(location.href);
  url.hash='p='+sessionKey;
  recipientReady=false;
  popup=window.open(url.href,'desk-'+sessionKey,'popup,width=1060,height=630');
  if (!popup) problem('请允许本页打开投影窗口。');
};
window.addEventListener('message',event=>{
  const data=event.data;
  if (!data || typeof data!=='object') return;
  if (projecting && event.source===window.opener && data.token===publicKey && data.type==='scene') applyPublic(data);
  if (!projecting && event.source===popup && data.token===sessionKey && data.type==='ready') {
    recipientReady=true;get('project').textContent='查看投影';publishView(true);
  }
});

function copyFrame(element) {
  const picture=document.createElement('canvas');
  picture.width=960;picture.height=540;
  picture.getContext('2d').drawImage(element,0,0,960,540);
  return picture;
}
const stagePhoto = element => copyFrame(element).toDataURL('image/png');

function landmarkError() {
  if (!LAB.calibration) return '';
  const points={spine:targetPoint(0,0),tip:targetPoint(1,.5),back:targetPoint(1,-.5),table:[.75,.80,.58]};
  let maxError=0,count=0;
  for (const view of LAB.calibration.views) {
    const pose={...anchor,yaw:view.yaw};
    for (const [key,point] of Object.entries(points)) {
      const ref=view.points[key];
      if(!ref)continue;
      const actual=liveScene?renderer.project(point,pose):projectStill(point,pose);
      maxError=Math.max(maxError,Math.hypot((actual[0]-ref[0])*960,(actual[1]-ref[1])*540));
      count++;
    }
  }
  const precision=maxError<.01?'小于 0.01':'为 '+maxError.toFixed(2);
  return count ? ' 四个定位点与 Blender 坐标最大差'+precision+' px（960 × 540）。' : '';
}
function presentPair(original) {
  if (!seamPair) return;
  get('before').src=original ? LAB.reference : seamPair.before;
  get('after').src=original ? LAB.referenceFirst : seamPair.after;
  get('seam').setAttribute('aria-pressed',String(!original));
  get('original').setAttribute('aria-pressed',String(original));
  get('pair-label').textContent=original
    ? '左：原课件的遵义会场静帧。右：原课件同名短片的解码首帧，两者统一显示画幅。本轮翻页实验另用了同一套桌景和机位。'
    : route==='B' ? '左：静止纸页。右：同一机位的实时翻页。拖动分界线看动作。'
    : (seamPair.from!==undefined ? '上次从 '+seamPair.from.toFixed(0)+'° 进入。左：交接前场景。右：当次解码首帧。' : '左：实验入片机位。右：交付短片实际解码首帧。')+landmarkError();
  get('divider').value='50';
  get('wipe').style.setProperty('--split','50%');
}
get('check').onclick=async()=>{
  if (projecting || !loaded) return;
  if (state.phase!=='browse' && !state.paused) togglePlay();
  const request=++comparisonEpoch;
  get('check').disabled=true;
  let decoder;
  try {
    let before,after,from;
    if (usesFilm && actualCut) {
      before=actualCut.before.toDataURL('image/png');
      after=actualCut.after.toDataURL('image/png');
      from=actualCut.from;
    } else if (liveScene) {
      renderer.draw(anchor,0,matchAmount(anchor),false);
      before=stagePhoto(space);
    } else before=stagePhoto(strips[8]);
    if (usesFilm && !after) {
      decoder=document.createElement('video');
      decoder.muted=true;decoder.playsInline=true;decoder.preload='auto';decoder.src=LAB.clip;
      await positionFilm(decoder,0);
      after=stagePhoto(decoder);
    } else if (!usesFilm) {
      renderer.draw(anchor,.29,0,false);
      after=stagePhoto(space);
    }
    if (request!==comparisonEpoch) return;
    seamPair={before,after,from};
    presentPair(false);
    get('comparison').showModal();
  } catch {problem('此设备未能读取对照帧。');}
  finally {
    if (decoder) {decoder.removeAttribute('src');decoder.load();}
    refresh();get('check').disabled=false;
  }
};
get('original').onclick=()=>presentPair(true);
get('seam').onclick=()=>presentPair(false);
get('divider').oninput=event=>get('wipe').style.setProperty('--split',event.target.value+'%');

async function boot() {
  get('play').disabled=true;
  try {
    if (usesFilm) {film.src=LAB.clip;await positionFilm(film,0);state.duration=film.duration;}
    if (liveScene) {
      space.hidden=false;resizeScene();
      renderer=await createDeskRenderer(space, LAB.scene, LAB.textures, {anchorImage:LAB.anchorImage,tailImage:LAB.tailImage});
    } else {
      strips=await Promise.all(LAB.views.map(imageReady));
      plate.width=strips[8].naturalWidth;plate.height=strips[8].naturalHeight;plate.hidden=false;
    }
    loaded=true;
    for (const id of ['play','check','project']) get(id).disabled=false;
    if(route==='B'){get('check').textContent='动作检查';get('compare-title').textContent='实时动作对照';get('seam').textContent='翻页前后';}
    get('notice').hidden=true;
    refresh();
    new ResizeObserver(resizeScene).observe(stage);
    animationFrame=requestAnimationFrame(tick);
    if(projecting && window.opener) window.opener.postMessage({type:'ready',token:publicKey},'*');
  } catch(error) {problem('会场未能打开：'+String(error.message||error));}
}
window.addEventListener('pagehide',()=>{
  epoch++;comparisonEpoch++;cancelAnimationFrame(animationFrame);film.pause();
  if(renderer)renderer.dispose();
  if(popup && !popup.closed)popup.close();
});
boot();
</script>
