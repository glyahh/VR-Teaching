name: 安全带公开基准验证
on:
  push:
    branches: ['verify/safety-harness-20261124']
    paths: ['.github/workflows/safety-public-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-baseline:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 sherpa-onnx==1.12.40 playwright==1.52.0
      - name: Public reference ASR and Edge capabilities
        shell: pwsh
        run: |
          @'
          import json, hashlib, time, urllib.request, wave, tempfile
          from pathlib import Path
          import numpy as np
          import sherpa_onnx as s
          from playwright.sync_api import sync_playwright
          out=Path("safety-public-results");out.mkdir(exist_ok=True)
          report={"scope":"public reference baseline; NOT course acceptance","models":{}}
          def save():
              (out/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf8")
          def get(repo, rev, name, target):
              p=out/target/name;p.parent.mkdir(exist_ok=True,parents=True)
              url=f"https://huggingface.co/csukuangfj/{repo}/resolve/{rev}/{name}"
              urllib.request.urlretrieve(url,p)
              report.setdefault("assets",[]).append({"url":url,"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
              save()
              return str(p)
          z="sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23"
          zr="204ad334e2e683fd295359930cc16fc0432a23ac"
          pa="sherpa-onnx-streaming-paraformer-bilingual-zh-en"
          pr="8e40c43232a1c5c66c82111efc5820d3accca11b"
          wavs=[]
          def run(rec,label):
              rows=[]
              for f in wavs:
                  with wave.open(f,"rb") as w:
                      rate=w.getframerate();assert w.getnchannels()==1 and w.getsampwidth()==2
                      data=np.frombuffer(w.readframes(w.getnframes()),dtype="<i2").astype(np.float32)/32768
                  stream=rec.create_stream();start=time.perf_counter()
                  for i in range(0,len(data),rate//10):
                      stream.accept_waveform(rate,data[i:i+rate//10])
                      while rec.is_ready(stream):rec.decode_stream(stream)
                  stream.accept_waveform(rate,np.zeros(int(rate*.8),np.float32));stream.input_finished()
                  while rec.is_ready(stream):rec.decode_stream(stream)
                  rows.append({"file":Path(f).name,"text":rec.get_result(stream),"seconds":len(data)/rate,"decode_ms":round((time.perf_counter()-start)*1000,2)})
              report["models"][label]=rows;save()
          try:
              wavs=[get(z,zr,"test_wavs/"+n,"zip") for n in ["0.wav","1.wav"]]
              rec=s.OnlineRecognizer.from_transducer(tokens=get(z,zr,"tokens.txt","zip"),encoder=get(z,zr,"encoder-epoch-99-avg-1.int8.onnx","zip"),decoder=get(z,zr,"decoder-epoch-99-avg-1.onnx","zip"),joiner=get(z,zr,"joiner-epoch-99-avg-1.int8.onnx","zip"),num_threads=1)
              run(rec,"zipformer");del rec
              rec=s.OnlineRecognizer.from_paraformer(tokens=get(pa,pr,"tokens.txt","para"),encoder=get(pa,pr,"encoder.int8.onnx","para"),decoder=get(pa,pr,"decoder.int8.onnx","para"),num_threads=1)
              run(rec,"paraformer");del rec
          except Exception as e:
              report["asr_error"]=repr(e);save()
          try:
              with tempfile.TemporaryDirectory() as d, sync_playwright() as p:
                  f=Path(d)/"probe.html";f.write_text("<!doctype html><button id='pop' onclick='window.open(location.href+\x22#projection\x22)'>Projection</button><video autoplay muted></video>",encoding="utf8")
                  b=p.chromium.launch(channel="msedge",headless=True,args=["--use-fake-device-for-media-stream","--use-fake-ui-for-media-stream"])
                  ctx=b.new_context(offline=True)
                  requests=[];ctx.on("request",lambda r:requests.append(r.url) if r.url.startswith(("http:","https:")) else None)
                  page=ctx.new_page();page.goto(f.as_uri())
                  caps=page.evaluate("""async()=>{const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});const v=document.querySelector('video');v.srcObject=stream;await v.play();const tracks=stream.getTracks();const size=[v.videoWidth,v.videoHeight];tracks.forEach(t=>t.stop());v.srcObject=null;const worker=new Worker(URL.createObjectURL(new Blob(['onmessage=()=>postMessage(42)'],{type:'text/javascript'})));const n=await new Promise((res,rej)=>{worker.onmessage=e=>res(e.data);worker.onerror=rej;worker.postMessage(0)});worker.terminate();return {secure:isSecureContext,size,tracks:tracks.map(t=>[t.kind,t.readyState]),worker:n}}""")
                  with page.expect_popup() as pop:page.locator("#pop").click()
                  screen=pop.value;screen.wait_for_load_state()
                  page.evaluate("()=>window.addEventListener('message',e=>{if(e.data==='ready')e.source.postMessage('snapshot','*')})")
                  message=screen.evaluate("()=>new Promise((resolve,reject)=>{const id=setTimeout(()=>reject(Error('no handshake')),5000);window.addEventListener('message',e=>{if(e.source===window.opener&&e.data==='snapshot'){clearTimeout(id);resolve(e.data)}},{once:true});window.opener.postMessage('ready','*')})")
                  assert message=="snapshot" and caps["secure"] and caps["worker"]==42 and all(x[1]=="ended" for x in caps["tracks"]) and not requests
                  report["edge"]={"version":b.version,"capabilities":caps,"popup":not screen.is_closed(),"http_requests":requests}
                  b.close();save()
          except Exception as e:
              report["edge_error"]=repr(e);save()
          # Independent, annotated public Mandarin speech: deterministic offsets,
          # both recognizers receive the same decoded audio. Do not tune on these rows.
          import re, subprocess, io, urllib.parse, random
          def normalized(t):return "".join(c.lower() for c in str(t) if c.isalnum())
          def edit(a,b):
              d=list(range(len(b)+1))
              for i,ca in enumerate(a,1):
                  nxt=[i]
                  for j,cb in enumerate(b,1):nxt.append(min(nxt[-1]+1,d[j]+1,d[j-1]+(ca!=cb)))
                  d=nxt
              return d[-1]
          def benchmark():
              dataset="hf-audio/open-asr-leaderboard-multilingual-datasets"
              config="aishell1_zh"
              def load_json(url):
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"VR-Teaching public ASR evaluation"}),timeout=60) as resp:
                      return json.load(resp)
              ds=[]
              for off in [0,1300,2600,3900,5200,6500]:
                  api="https://datasets-server.huggingface.co/rows?"+urllib.parse.urlencode({"dataset":dataset,"config":config,"split":"test","offset":off,"length":6})
                  payload=load_json(api)
                  for entry in payload["rows"]:
                      row=entry["row"];text_ref=row.get("text") or row.get("sentence") or row.get("transcription") or row.get("transcript")
                      audio=row.get("audio")
                      if isinstance(audio,list):audio=audio[0]
                      if not isinstance(audio,dict) or not isinstance(text_ref,str) or not normalized(text_ref):
                          raise ValueError("Unexpected dataset schema "+str(list(row)))
                      src=audio["src"];f=out/("aishell-"+str(entry["row_idx"])+".audio")
                      urllib.request.urlretrieve(src,f)
                      pcm=subprocess.check_output(["ffmpeg","-v","error","-i",str(f),"-ac","1","-ar","16000","-f","f32le","pipe:1"])
                      arr=np.frombuffer(pcm,dtype="<f4").copy()
                      if not len(arr):raise ValueError("empty audio")
                      ds.append((entry["row_idx"],text_ref,arr,hashlib.sha256(f.read_bytes()).hexdigest()))
              assert len(ds)==36
              report["benchmark"]={"dataset":dataset,"config":config,"split":"test","n":len(ds),"license":"AISHELL-1 Apache-2.0 (see source card)","models":{}}
              def rec_factory(kind):
                  if kind=="zipformer":
                      return s.OnlineRecognizer.from_transducer(tokens=str(out/"zip/tokens.txt"),encoder=str(out/"zip/encoder-epoch-99-avg-1.int8.onnx"),decoder=str(out/"zip/decoder-epoch-99-avg-1.onnx"),joiner=str(out/"zip/joiner-epoch-99-avg-1.int8.onnx"),num_threads=1)
                  return s.OnlineRecognizer.from_paraformer(tokens=str(out/"para/tokens.txt"),encoder=str(out/"para/encoder.int8.onnx"),decoder=str(out/"para/decoder.int8.onnx"),num_threads=1)
              for kind in ["zipformer","paraformer"]:
                  rec=rec_factory(kind);scores={}
                  for condition in ["clean","noise_15db"]:
                      rows=[]
                      for idx,ref,data,sha in ds:
                          arr=data.copy()
                          if condition!="clean":
                              rng=np.random.default_rng(idx+761)
                              noise=rng.standard_normal(arr.size).astype(np.float32)
                              noise*=np.sqrt(np.mean(arr**2)/(np.mean(noise**2)*10**1.5+1e-12))
                              arr=np.clip(arr+noise,-1,1)
                          stream=rec.create_stream();t0=time.perf_counter()
                          for i in range(0,len(arr),1600):
                              stream.accept_waveform(16000,arr[i:i+1600])
                              while rec.is_ready(stream):rec.decode_stream(stream)
                          stream.accept_waveform(16000,np.zeros(12800,np.float32));stream.input_finished()
                          while rec.is_ready(stream):rec.decode_stream(stream)
                          hyp=rec.get_result(stream);n=len(normalized(ref));e=edit(normalized(ref),normalized(hyp))
                          rows.append({"row":idx,"reference_chars":n,"edits":e,"seconds":len(arr)/16000,"rtf":(time.perf_counter()-t0)/(len(arr)/16000),"exact":e==0,"audio_sha256":sha})
                      scores[condition]={"cer":sum(r["edits"] for r in rows)/sum(r["reference_chars"] for r in rows),"exact":sum(r["exact"] for r in rows),"median_rtf":float(np.median([r["rtf"] for r in rows])),"rows":rows}
                      report["benchmark"]["models"][kind]=scores;save()
                  del rec
          try:
              if "asr_error" not in report:benchmark()
              else:raise RuntimeError("reference model unavailable")
          except Exception as e:
              report["benchmark_error"]=repr(e);save()
          reference="对我做了介绍那么我想说的是大家如果对我的研究感兴趣"
          for key,rows in report["models"].items():
              rows[0]["matches_upstream_reference"]=(rows[0]["text"]==reference)
          save()
          print(json.dumps(report,ensure_ascii=False))
          if "asr_error" in report or "edge_error" in report or "benchmark_error" in report:raise SystemExit(1)
          '@ | Set-Content -Encoding utf8 safety-public-baseline.py
          python safety-public-baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-public-baseline-report
          path: safety-public-results/report.json
