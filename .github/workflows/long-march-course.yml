name: 长征离线课件

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      COURSE_EDGE_RENDER_SCALE: "0.5"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix "课堂演示/自由探索实验" ci
      - run: npm --prefix "课堂演示/自由探索实验" run check:course
      - run: node "Test/verify-presentation-policy.mjs"
      - name: 从源码构建并校验离线课件
        run: |
          New-Item -ItemType Directory -Force ".march-build/ci" | Out-Null
          node "课堂演示/build.mjs" 2>&1 | Tee-Object -FilePath ".march-build/ci/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "课堂演示/build.mjs" --check 2>&1 | Tee-Object -FilePath ".march-build/ci/build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- "展示材料/成果展示/成果与计划.html"
          exit $LASTEXITCODE
      - name: 记录课件哈希和回归清单
        env:
          COURSE_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:COURSE_CI_BASE
          if ($base -match '^(?!0{40}$)[0-9a-f]{40}$') {
            git cat-file -e "$base^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git fetch --no-tags --depth=1 origin $base
            }
          }
          python -B "Test/run-course-ci.py" plan "--base=$base"
      - run: python -m pip install playwright==1.63.0 Pillow==12.2.0
      - name: 安装中文显示字体
        shell: bash
        run: |
          ubuntu_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${ubuntu_sources[@]}" -o Acquire::Retries=3 update -qq
          sudo apt-get "${ubuntu_sources[@]}" -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
      - name: 断网 Edge 回归
        run: python -B "Test/run-course-ci.py" run --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 长征课 Edge 验收 ${{ matrix.shard }}
          path: .march-build/ci/
          include-hidden-files: true
          if-no-files-found: ignore
